name: Publish image to GitHub Packages
on: 
 release:
    types: [created]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout Sourcecode
      uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
    - name: Build and Test with Gradle
      run: ./gradlew build -Dquarkus.container-image.build=true -Dquarkus.container-image.push=true -Dquarkus.container-image.registry=ghcr.io -Dquarkus.container-image.group=${{ GITHUB_REPOSITORY_OWNER }} -Dquarkus.container-image.name=name=hot-water-control -Dquarkus.container-image.tag=1.0.0 -Dquarkus.container-image.username=${{ GITHUB_REPOSITORY_OWNER }} -Dquarkus.container-image.password=${{ secrets.PERSONAL_GITHUB_TOKEN }}

