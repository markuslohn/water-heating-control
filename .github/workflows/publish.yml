name: Build and Publish
on: 
 workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0 or 1.0.0-SNAPSHOT)'
        required: true
        type: string
 release:
    types: [created, published]
env:
    JAVA_VERSION: '21'
    JAVA_DISTRIBUTION: 'temurin'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
    - name: Extract version from tag
      id: version
      run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
            VERSION=${VERSION#v}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set Container Image Labels
      run: |
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cat >> gradle.properties << EOF
          quarkus.container-image.labels."org.opencontainers.image.source"=https://github.com/${{ github.repository }}
          quarkus.container-image.labels."org.opencontainers.image.description"=Quarkus Application
          quarkus.container-image.labels."org.opencontainers.image.url"=https://github.com/${{ github.repository }}
          quarkus.container-image.labels."org.opencontainers.image.revision"=${{ github.sha }}
          quarkus.container-image.labels."org.opencontainers.image.version"=${{ steps.version.outputs.version }}
          quarkus.container-image.labels."org.opencontainers.image.created"=${BUILD_DATE}
          quarkus.container-image.labels."org.opencontainers.image.licenses"=MIT
          quarkus.container-image.labels."org.opencontainers.image.ref.name"=${{ github.ref_name }}
          EOF
    - name: Build and Push Docker Image
      run: |
           ./gradlew build \
             -Dquarkus.container-image.build=true \
             -Dquarkus.container-image.push=true \
             -Dquarkus.container-image.registry=ghcr.io \
             -Dquarkus.container-image.group=${{ github.repository_owner }} \
             -Dquarkus.container-image.name=${{ github.event.repository.name }} \
             -Dquarkus.container-image.tag=${{ steps.version.outputs.version }} \
             -Dquarkus.container-image.additional-tags=latest,$(git rev-parse --short HEAD)
        


