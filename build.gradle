plugins {
    id 'java'
    id 'io.quarkus'
    id 'com.diffplug.spotless' version '6.24.0'
    id 'com.gorylenko.gradle-git-properties' version '2.5.5'
}

group = 'de.bimalo.homeauto'

// Version aus Git-Tags ermitteln
def getVersionFromGit() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags', '--always', '--dirty'
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        def version = stdout.toString().trim()
        if (version.isEmpty()) {
            return 'dev-SNAPSHOT'
        }
        // Entferne führendes 'v' wenn vorhanden
        return version.startsWith('v') ? version.substring(1) : version
    } catch (Exception e) {
        return 'dev-SNAPSHOT'
    }
}

version = getVersionFromGit()

gitProperties {
    keys = ['git.branch', 'git.commit.id.abbrev', 'git.commit.time', 'git.commit.id.describe']
    dateFormat = "yyyy-MM-dd'T'HH:mm:ssZ"
    dateFormatTimeZone = "UTC"
}

def getGitProperty(String key, String defaultValue = 'unknown') {
    def gitPropsFile = file("${buildDir}/resources/main/git.properties")
    if (gitPropsFile.exists()) {
        def props = new Properties()
        gitPropsFile.withInputStream { props.load(it) }
        return props.getProperty(key, defaultValue)
    }
    return defaultValue
}

task loadGitProperties {
    dependsOn processResources
    doLast {
        project.ext.gitCommit = getGitProperty('git.commit.id.abbrev')
        project.ext.gitBranch = getGitProperty('git.branch')
        project.ext.buildTime = new Date().format("yyyy-MM-dd HH:mm:ss", TimeZone.getTimeZone("Europe/Berlin"))
    }
}

quarkusBuild.dependsOn loadGitProperties


repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation 'io.quarkus:quarkus-container-image-jib'
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-hibernate-validator'
    implementation 'io.quarkus:quarkus-config-yaml'
    implementation 'io.quarkus:quarkus-scheduler'
    implementation 'io.quarkus:quarkus-smallrye-fault-tolerance'

    // Logging Adapter
    implementation 'org.jboss.slf4j:slf4j-jboss-logmanager'

    // Modbus TCP client library
    implementation 'com.digitalpetri.modbus:modbus-tcp:2.1.3'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    
    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.rest-assured:rest-assured'
    
    // Testing dependencies
    testImplementation 'org.mockito:mockito-core:5.7.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.7.0'
    testCompileOnly("org.projectlombok:lombok:1.18.42")
	testAnnotationProcessor("org.projectlombok:lombok:1.18.42")
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

test {
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"

    // Exclude integration tests by default
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

// Separate task for integration tests
task integrationTest(type: Test) {
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"

    // Only run integration tests
    useJUnitPlatform {
        includeTags 'integration'
    }

    shouldRunAfter test
}

// Configure JVM args for Quarkus tasks (required for Java 24+)
tasks.withType(JavaExec).configureEach {
    jvmArgs = ['--add-opens', 'java.base/java.lang=ALL-UNNAMED', '-XX:+EnableDynamicAgentLoading']
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

spotless {
    enforceCheck = false  // Temporarily disable spotless checks
    java {
        // Basic formatting rules without Google Java Format
        importOrder()
        removeUnusedImports()
        indentWithSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
          
        // Ensure consistent line endings
        lineEndings 'UNIX'
        
        // Exclude generated files
        targetExclude 'build/**', 'src/main/resources/**', 'src/test/resources/**'
    }
}
