<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heizstab-Steuerung</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .status-box {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .status-box:hover {
            transform: translateY(-5px);
        }

        .status-box h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .status-label {
            font-weight: 600;
            color: #555;
        }

        .status-value {
            color: #333;
            font-weight: 500;
        }

        .status-value.positive {
            color: #10b981;
        }

        .status-value.negative {
            color: #ef4444;
        }

        .heating-active {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .heating-inactive {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .heating-active h2,
        .heating-inactive h2 {
            color: white;
            border-bottom-color: white;
        }

        .heating-active .status-label,
        .heating-inactive .status-label {
            color: rgba(255, 255, 255, 0.9);
        }

        .heating-active .status-value,
        .heating-inactive .status-value {
            color: white;
            font-weight: 600;
        }

        .control-box {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .control-box h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .control-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="number"] {
            flex: 1;
            min-width: 150px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
        }

        .last-update {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 0.9em;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .status-grid {
                grid-template-columns: 1fr;
            }

            .control-group {
                flex-direction: column;
                width: 100%;
            }

            input[type="number"],
            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔥 Heizstab-Steuerung</h1>

        <div class="status-grid">
            <!-- Batteriestatus -->
            <div class="status-box">
                <h2>⚡ Batteriestatus</h2>
                <div class="status-item">
                    <span class="status-label">Batterieladung:</span>
                    <span class="status-value" id="battery-soc">-</span>
                </div>
                <div class="status-item">
                    <span class="status-label">PV-Produktion:</span>
                    <span class="status-value positive" id="battery-production">-</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Hausverbrauch:</span>
                    <span class="status-value" id="battery-consumption">-</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Batterie-Leistung:</span>
                    <span class="status-value" id="battery-power">-</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Netz-Leistung:</span>
                    <span class="status-value" id="grid-power">-</span>
                </div>
            </div>

            <!-- Heizstab-Status -->
            <div class="status-box" id="heating-status-box">
                <h2>🔥 Heizstab</h2>
                <div class="status-item">
                    <span class="status-label">Status:</span>
                    <span class="status-value" id="heating-active">-</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Aktuelle Leistung:</span>
                    <span class="status-value" id="heating-power">-</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Aktuelle Temperatur:</span>
                    <span class="status-value" id="current-temp">-</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Zieltemperatur:</span>
                    <span class="status-value" id="target-temp">-</span>
                </div>
            </div>
        </div>

        <!-- Manuelle Steuerung -->
        <div class="control-box">
            <h2>🎛️ Manuelle Steuerung</h2>
            <div class="control-group">
                <input type="number" id="watt-input" min="0" max="3500" step="100" value="0"
                    placeholder="Leistung in Watt">
                <button class="btn-primary" onclick="setHeating()">Setzen</button>
                <button class="btn-danger" onclick="stopHeating()">Stoppen</button>
            </div>
        </div>

        <div class="last-update">
            Letzte Aktualisierung: <span id="last-update">-</span>
        </div>
    </div>

    <script>
        // Auto-Refresh alle 10 Sekunden
        setInterval(updateStatus, 10000);
        updateStatus();

        function formatPower(watts) {
            return watts > 0 ? `+${watts} W` : `${watts} W`;
        }

        function formatPercentage(value) {
            return `${value}%`;
        }

        function formatTemperature(temp) {
            if (!temp) return '-';
            return `${temp.celsius.toFixed(1)}°C`;
        }

        async function updateStatus() {
            console.log('[DEBUG] updateStatus called at:', new Date().toLocaleTimeString('de-DE'));

            try {
                // Battery Status
                console.log('[DEBUG] Fetching battery status...');
                const batteryResponse = await fetch('/api/battery/status');
                console.log('[DEBUG] Battery response status:', batteryResponse.status);

                const battery = await batteryResponse.json();
                console.log('[DEBUG] Battery data:', battery);

                document.getElementById('battery-soc').textContent = formatPercentage(battery.batteryStateOfCharge.value);
                document.getElementById('battery-production').textContent = formatPower(battery.productionPower.watts);
                document.getElementById('battery-consumption').textContent = formatPower(battery.consumptionPower.watts);
                document.getElementById('battery-power').textContent = formatPower(battery.batteryPower.watts);

                const gridPower = battery.gridPower.watts;
                const gridElement = document.getElementById('grid-power');
                gridElement.textContent = formatPower(gridPower);
                gridElement.className = 'status-value ' + (gridPower > 0 ? 'negative' : 'positive');

                // Heating Status
                console.log('[DEBUG] Fetching heating status...');
                const heatingResponse = await fetch('/api/heatingrod/status');
                console.log('[DEBUG] Heating response status:', heatingResponse.status);

                const heating = await heatingResponse.json();
                console.log('[DEBUG] Heating data:', heating);

                document.getElementById('heating-active').textContent = heating.active ? '🟢 AN' : '🔴 AUS';
                document.getElementById('heating-power').textContent = `${heating.power.watts} W`;
                document.getElementById('current-temp').textContent = formatTemperature(heating.currentTemperature);
                document.getElementById('target-temp').textContent = formatTemperature(heating.targetTemperature);

                const box = document.getElementById('heating-status-box');
                box.className = 'status-box ' + (heating.active ? 'heating-active' : 'heating-inactive');

                // Update timestamp
                document.getElementById('last-update').textContent = new Date().toLocaleTimeString('de-DE');
                console.log('[DEBUG] Update completed successfully');
            } catch (error) {
                console.error('[ERROR] Error updating status:', error);
                console.error('[ERROR] Error stack:', error.stack);
            }
        }

        async function setHeating() {
            const watts = document.getElementById('watt-input').value;
            if (watts < 0 || watts > 3500) {
                alert('Bitte einen Wert zwischen 0 und 3500 W eingeben');
                return;
            }

            try {
                const response = await fetch(`/api/heatingrod/control?watts=${watts}`, { method: 'POST' });
                if (response.ok) {
                    updateStatus();
                } else {
                    const error = await response.text();
                    alert('Fehler: ' + error);
                }
            } catch (error) {
                alert('Fehler beim Setzen der Heizleistung: ' + error.message);
            }
        }

        async function stopHeating() {
            try {
                await fetch('/api/heatingrod/control?watts=0', { method: 'POST' });
                document.getElementById('watt-input').value = 0;
                updateStatus();
            } catch (error) {
                alert('Fehler beim Stoppen der Heizung: ' + error.message);
            }
        }
    </script>
</body>

</html>
